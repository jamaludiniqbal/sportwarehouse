<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header></header>
    <main class="wrapper">
      <form action="#">
        <div class="content">
          <img
            src="images/sports-warehouse-logo-600.png"
            alt="Sport Warehouse Logo"
            class="image"
          />
          <h2>Where Passion Meets Performance Your Game Starts Here</h2>

          <p>
            Sports warehouse is coming soon. If you have any questions, we would
            love to hear from you, please complete the following information.
          </p>
          <div class="column">
            <div class="first-column">
              <label for="firstName">First Name:</label>
              <input
                type="text"
                name="firstName"
                id="firstName"
                placeholder="Enter your first name"
              />

              <label for="lastName">Last Name:</label>
              <input
                type="text"
                name="lastName"
                id="lastName"
                placeholder="Enter your last name"
              />
            </div>

            <div class="second-column">
              <label for="contact">Contact Number</label>
              <input
                type="text"
                name="contact"
                id="contact"
                placeholder="Enter your contact number"
              />

              <label for="email">Email</label>
              <input
                type="text"
                name="email"
                id="email"
                placeholder="Enter your email"
              />
            </div>
          </div>
          <label for="message" class="label">Message:</label>
          <textarea
            name="message"
            class="message"
            id="message"
            rows="5"
            cols="30"
            placeholder="Enter your message"
          ></textarea>

          <button type="submit" class="submit-btn">Submit</button>
        </div>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
