<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Page</title>
    <link rel="stylesheet" href="assets/style.css" />

  </head>
  <body>
    <header></header>
    <main class="wrapper">
      <form action="register.php" id="contactForm">
        <div class="content">
          <img
            src="images/sports-warehouse-logo-600.png"
            alt="Sport Warehouse Logo"
            class="image"
          />
          <h2>Where Passion Meets Performance Your Game Starts Here</h2>

          <p>
            Sports warehouse is coming soon. If you have any questions, we would
            love to hear from you, please complete the following information.
          </p>
          <div class="column">
                <div class="form-group">
                <input
                    type="text"
                    name="firstName"
                    id="firstName"
                    placeholder=""
                />
                <label for="firstName">First Name:</label>

                  <!-- <div class="message error">First name is required.</div> -->
                     
                </div>
            
                <div class="form-group">
              <input type="text" name="lastName" id="lastName" placeholder="" />
              <label for="lastName">Last Name:</label>
                              <small class="validation"></small>
                </div>
            </div>

            <div class="column">
              <div class="form-group">
                <input type="text" name="contact" id="contact" placeholder="" />
                <label for="contact">Contact Number</label>
                                <small class="validation"></small>
              </div>

              <div class="form-group">
                <input
                  type="text"
                  name="email"
                  id="email"
                  placeholder=" "
                />
                <label for="email">Email</label>
                <small class="validation"></small>
              </div>
            
            </div>
           
           <div class="form-group">
             <textarea
              name="message"

              id="message"
              rows="5"
              cols="30"
              placeholder=" "
            ></textarea>
            <label for="message" class="label">Message:</label>
                           <small class="validation"></small>
            </div>
                   
            <button type="submit" class="submit-btn">Submit</button>


          </div>

      

        </div>
      </form>
    </main>
    <footer></footer>
        <script src="assets/script.js"></script>
  </body>
</html>
